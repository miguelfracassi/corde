<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex"><link rel="icon" href="/cord.png"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><title>Minhas faturas, Sua Cord</title></head><body>
<div class="glow"></div>
<nav class="top glass"><a href="/" class="brand"><img src="/logo.png" alt=""><span>Cord</span></a><a class="btn btn-ghost" href="/suacord">Minha conta</a></nav>
<main class="wrap"><h1 id="t" style="margin-top:34px">Faturas</h1>
<div class="tabs" id="tabs"></div><div id="v"></div><div class="msg" id="m" role="status"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script>
const sb=supabase.createClient(CORD.url,CORD.key),$=id=>document.getElementById(id);
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a)k==='class'?e.className=a[k]:k.startsWith('on')?e[k]=a[k]:e.setAttribute(k,a[k]);c.flat().forEach(x=>e.append(x));return e};
const R=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const D=s=>s?s.slice(0,10).split('-').reverse().join('/'):'';
const hoje=new Date().toISOString().slice(0,10);
const st=i=>i.status==='paid'?['Paga','paid']:i.status==='canceled'?['Cancelada','canceled']:i.due_date<hoje?['Vencida','late']:['Pendente','pending'];
const msg=(t,c)=>{$('m').textContent=t;$('m').className='msg '+(c||'')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let U,T,inv=[];
const call=async(p,b)=>{const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Erro');return j};
function tabs(on){$('tabs').replaceChildren(...[['/faturas','Faturas','f'],['/faturas/extrato','Extrato','e']].map(([u,n,k])=>h('a',{href:u,class:on===k?'on':''},n)))}
function badge(i){const[n,k]=st(i);return h('span',{class:'badge b-'+k},n)}

/* nota (comprovante) em PDF via impressão do navegador */
function nota(i){const w=open('','_blank');if(!w)return msg('Libere pop-ups para baixar a nota.','err');
  w.document.write('<title>Nota '+esc(i.code)+'</title><body style="font:15px Arial;max-width:560px;margin:40px auto;color:#111"><h2>Cord, Grupo Ticord</h2><p>Comprovante de pagamento</p><hr><p><b>Nota nº</b> '+esc(i.code)+'</p><p><b>Cliente:</b> '+esc((U.user_metadata&&U.user_metadata.full_name)||'')+' ('+esc(U.email)+')</p><p><b>Produto:</b> '+esc(i.description)+'</p><p><b>Valor:</b> '+R(i.amount_cents)+'</p><p><b>Pago em:</b> '+new Date(i.paid_at).toLocaleString('pt-BR')+'</p><p><b>Forma:</b> PIX (Mercado Pago)</p><hr><p style="font-size:12px;color:#555">Guarde este comprovante: ele é necessário para qualquer pedido de reembolso, conforme os Termos de Serviço.</p><script>onload=()=>print()<\/script></body>');w.document.close()}

function lista(arr,extra){return arr.length?arr.map(i=>h('div',{class:'glass row'},h('div',{},h('b',{},i.description),h('small',{},'Vence em '+D(i.due_date)+' · '+R(i.amount_cents))),h('div',{style:'display:flex;gap:10px;align-items:center'},badge(i),extra(i)))):[h('p',{style:'color:var(--muted)'},'Nada por aqui ainda.')]}

function viewFaturas(){tabs('f');$('t').textContent='Faturas';
  const ab=inv.filter(i=>i.status==='pending').sort((a,b)=>a.due_date<b.due_date?-1:1);
  const subs={};inv.filter(i=>i.subscription_id&&i.status==='pending').forEach(i=>(subs[i.subscription_id]=subs[i.subscription_id]||[]).push(i));
  const ctrl=i=>h('a',{class:'btn btn-solid',href:'/faturas/pagar/'+i.code},'Pagar fatura');
  $('v').replaceChildren(h('h3',{style:'margin:8px 0 14px'},'Em aberto e futuras'),...lista(ab,ctrl),
    h('h3',{style:'margin:30px 0 14px'},'Compras e assinaturas'),
    ...(Object.keys(subs).length?Object.entries(subs).map(([id,a])=>h('div',{class:'glass row'},h('div',{},h('b',{},a[0].description),h('small',{},'Assinatura · '+a.length+' fatura(s) restante(s)')),h('button',{class:'btn btn-danger',onclick:async e=>{if(!confirm('Cancelar esta assinatura? As faturas futuras serão canceladas.'))return;e.target.disabled=true;try{const r=await call('/api/cancel',{subscription_id:id});msg(r.canceled+' fatura(s) cancelada(s).','ok');await load();viewFaturas()}catch(x){msg(x.message,'err')}}},'Cancelar assinatura'))):[h('p',{style:'color:var(--muted)'},'Você não tem assinaturas ativas.')]));}

function viewExtrato(){tabs('e');$('t').textContent='Extrato';
  const p=inv.filter(i=>i.status==='paid').sort((a,b)=>a.paid_at<b.paid_at?1:-1);
  $('v').replaceChildren(...lista(p,i=>h('button',{class:'btn btn-ghost',onclick:()=>nota(i)},'Baixar nota')))}

async function viewPagar(code){tabs('');$('t').textContent='Pagar fatura';
  const i=inv.find(x=>x.code===code);
  if(!i)return $('v').replaceChildren(h('p',{},'Fatura não encontrada.'));
  const box=h('div',{class:'glass pay'});$('v').replaceChildren(box);
  const done=()=>box.replaceChildren(h('h2',{},'Pagamento confirmado'),h('p',{style:'color:var(--muted)'},i.description+' · '+R(i.amount_cents)),h('button',{class:'btn btn-solid',onclick:()=>nota(i)},'Baixar nota'),h('p',{},h('a',{href:'/faturas/extrato',style:'text-decoration:underline'},'Ver extrato')));
  if(i.status==='paid')return done();
  if(i.status!=='pending')return box.replaceChildren(h('p',{},'Esta fatura foi cancelada.'));
  try{const p=await call('/api/pay',{code});
    const ta=h('textarea',{readonly:'',onclick:e=>e.target.select()});ta.value=p.pix_code;
    box.replaceChildren(h('h2',{},R(i.amount_cents)),h('p',{style:'color:var(--muted)'},i.description),h('img',{src:'data:image/png;base64,'+p.pix_qr,alt:'QR Code PIX'}),ta,
      h('button',{class:'btn btn-solid',style:'margin-top:12px;width:100%',onclick:async e=>{await navigator.clipboard.writeText(p.pix_code);e.target.textContent='Código copiado!'}},'Copiar código PIX'),
      h('p',{style:'color:var(--muted);font-size:.85rem'},'Aguardando pagamento... esta tela atualiza sozinha.'));
    const t=setInterval(async()=>{await load();const n=inv.find(x=>x.code===code);if(n&&n.status==='paid'){clearInterval(t);Object.assign(i,n);done()}},5000)
  }catch(x){box.replaceChildren(h('p',{class:'err'},x.message))}}

async function load(){const{data,error}=await sb.from('invoices').select('*').order('due_date');if(error)throw error;inv=data}
(async()=>{
  const{data}=await sb.auth.getSession();if(!data.session)return location.href='/suacord';
  U=data.session.user;T=data.session.access_token;
  try{await load()}catch(e){return msg('Não foi possível carregar: '+e.message,'err')}
  const p=location.pathname;
  p.startsWith('/faturas/pagar/')?viewPagar(p.split('/').pop()):p==='/faturas/extrato'?viewExtrato():viewFaturas();
})();
</script></body></html>
